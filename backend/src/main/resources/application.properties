spring.application.name=sportCenter
spring.config.import=optional:file:.env[.properties]
# ===============================
# SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:14333;databaseName=SportCenterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Comma-separated explicit browser origins; never use '*'.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Local images are stored outside application resources. Relative paths resolve from the backend working directory.
app.images.storage-directory=${IMAGE_STORAGE_DIRECTORY:uploads}
app.images.max-file-size=${IMAGE_MAX_FILE_SIZE:5MB}
app.images.public-url-prefix=/api/public/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# JPA / HIBERNATE
# ===============================
# Schema changes are applied only through reviewed, manual SQL Server migrations.
spring.jpa.hibernate.ddl-auto=validate
app.pt.session-base-price=${APP_PT_SESSION_BASE_PRICE:500000}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# Payment (Flow 3): mock online payment is simulator-only and disabled unless a demo/test profile opts in.
app.payment.mock-gateway.enabled=${PAYMENT_MOCK_GATEWAY_ENABLED:false}
app.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:}
# Online gateway: "mock" (default; demo/test simulator) or "vnpay" (VNPay sandbox, https://sandbox.vnpayment.vn).
app.payment.provider=${PAYMENT_PROVIDER:mock}
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
# Where the browser lands after the VNPay return URL (gets ?paymentId=..&paymentStatus=..).
app.payment.frontend-result-url=${PAYMENT_FRONTEND_RESULT_URL:http://localhost:5173/member/membership}

# Never include internal exception details or stack traces in HTTP error responses.
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter=TRACE
