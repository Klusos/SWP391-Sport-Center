spring.application.name=sportCenter
spring.config.import=optional:file:.env[.properties]
# ===============================
# SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SportCenterDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Comma-separated explicit browser origins; never use '*'.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===============================
# JPA / HIBERNATE
# ===============================
# Schema changes are applied only through reviewed, manual SQL Server migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# Never include internal exception details or stack traces in HTTP error responses.
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
