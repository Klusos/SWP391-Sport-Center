spring.application.name=sportCenter
server.port=8080
spring.config.import=optional:file:.env[.properties]
# ===============================
# SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=SportCenterDemo;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Normal runtime defaults from the approved operational handoff. Isolated QA must
# explicitly override all three settings to false for its process.
sportcenter.scheduling.enabled=true
sportcenter.class-session-completion.interval-ms=300000
sportcenter.renewal.scheduler.enabled=true
sportcenter.pt.outcome-fallback.enabled=false
sportcenter.pt.outcome-fallback.rollout-cutover=
sportcenter.pt.outcome-fallback.interval-ms=60000
sportcenter.membership.scheduler.cron=0 0 0 * * *
sportcenter.membership.scheduler.time-zone=Asia/Ho_Chi_Minh
sportcenter.renewal.scheduler.cron=0 */15 * * * *
sportcenter.renewal.scheduler.time-zone=Asia/Ho_Chi_Minh
app.course-registration.expiration-sweep-interval-ms=60000
app.pt.expiration-sweep-interval-ms=60000

# Comma-separated explicit browser origins; never use '*'.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Local images are stored outside application resources. Relative paths resolve from the backend working directory.
app.images.storage-directory=${IMAGE_STORAGE_DIRECTORY:uploads}
app.images.max-file-size=5MB
app.images.public-url-prefix=/api/public/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# JPA / HIBERNATE
# ===============================
# Schema changes are applied only through reviewed, manual SQL Server migrations.
spring.jpa.hibernate.ddl-auto=validate
app.pt.session-base-price=500000
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# Owner-selected normal provider is VNPay; mock settlement is disabled in normal runtime.
app.payment.mock-gateway.enabled=false
app.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:}
app.payment.provider=vnpay
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
# Where the browser lands after the VNPay return URL (gets ?paymentId=..&paymentStatus=..).
app.payment.frontend-result-url=${PAYMENT_FRONTEND_RESULT_URL:http://localhost:5173/member/membership}

# Never include internal exception details or stack traces in HTTP error responses.
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter=TRACE
