# Explicitly selected only by RenewalSettlementSqlServerIT. Never store credentials here.
spring.datasource.url=${RENEWAL_SQLSERVER_JDBC_URL}
spring.datasource.username=${RENEWAL_SQLSERVER_USERNAME}
spring.datasource.password=${RENEWAL_SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.main.web-application-type=none
app.scheduled-jobs.enabled=false
app.jwt.secret=${RENEWAL_SQLSERVER_JWT_SECRET}
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
