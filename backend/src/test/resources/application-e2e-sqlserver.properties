# Explicit opt-in profile for the SQL Server HTTP E2E harness. Never store credentials here.
spring.datasource.url=${E2E_SQLSERVER_JDBC_URL}
spring.datasource.username=${E2E_SQLSERVER_USERNAME}
spring.datasource.password=${E2E_SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=0
app.jwt.secret=${E2E_SQLSERVER_JWT_SECRET}
app.payment.callback-secret=e2e-test-payment-callback-secret
app.cors.allowed-origins=http://localhost
debug=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
